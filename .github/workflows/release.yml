name: Publish extension release

on:
  workflow_dispatch:
    inputs:
      package:
        description: Package directory
        required: true
        type: choice
        options: [ask-ai, base64, data-tools, jwt-inspector, mermaid-viewer]
      version:
        description: Exact manifest version
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: extension-release-${{ inputs.package }}-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Check out the pinned ClipsX package tool
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: azure06/clipsx
          path: clipsx-host
          ref: 2129af6868e1db3c81ae67956da83440abf4fd4a
      - name: Install host validator dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libxdo-dev
      - run: rustup target add wasm32-unknown-unknown
      - run: npm ci
      - name: Validate release identity
        shell: bash
        run: |
          set -euo pipefail
          manifest="extensions/${{ inputs.package }}/clipsx-extension.toml"
          grep -Fxq "version = \"${{ inputs.version }}\"" "$manifest"
          grep -Eq '^packageId = "infiniti\.[a-z0-9-]+"$' "$manifest"
      - name: Build reviewed release assets
        env:
          CLIPSX_REPO: ${{ github.workspace }}/clipsx-host
        run: |
          package_id="$(sed -n 's/^packageId = "\([^"]*\)"/\1/p' "extensions/${{ inputs.package }}/clipsx-extension.toml")"
          release_slug="${package_id#infiniti.}"
          tag="${release_slug}-v${{ inputs.version }}"
          asset="${release_slug}-${{ inputs.version }}.clipsx"
          url="https://github.com/${{ github.repository }}/releases/download/${tag}/${asset}"
          npm run package -- "${{ inputs.package }}" "dist/${asset}" "$url"
      - name: Create immutable draft release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          package_id="$(sed -n 's/^packageId = "\([^"]*\)"/\1/p' "extensions/${{ inputs.package }}/clipsx-extension.toml")"
          release_slug="${package_id#infiniti.}"
          tag="${release_slug}-v${{ inputs.version }}"
          asset="dist/${release_slug}-${{ inputs.version }}.clipsx"
          metadata="dist/${release_slug}-${{ inputs.version }}.registry.json"
          ! gh release view "$tag" >/dev/null 2>&1
          gh release create "$tag" "$asset" "$metadata" \
            --target "$GITHUB_SHA" \
            --title "${{ inputs.package }} ${{ inputs.version }}" \
            --notes "Reviewed Infiniti ClipsX extension release." \
            --draft

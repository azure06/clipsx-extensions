name: Publish extension release

on:
  workflow_dispatch:
    inputs:
      package:
        description: Package directory
        required: true
        type: choice
        options: [ask-ai, base64, data-tools, jwt-inspector, mermaid-viewer]

permissions:
  contents: write

concurrency:
  group: extension-release-${{ inputs.package }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check out the pinned ClipsX package tool
        uses: actions/checkout@v4
        with:
          repository: azure06/clipsx
          path: clipsx-host
          ref: 2129af6868e1db3c81ae67956da83440abf4fd4a
      - name: Install host validator dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libxdo-dev
      - run: rustup target add wasm32-unknown-unknown
      - run: npm ci
      - name: Validate release identity
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          manifest="extensions/${{ inputs.package }}/clipsx-extension.toml"
          grep -Eq '^packageId = "infiniti\.[a-z0-9-]+"$' "$manifest"
          package_id="$(sed -n 's/^packageId = "\([^"]*\)"/\1/p' "$manifest")"
          version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' "$manifest")"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]
          release_slug="${package_id#infiniti.}"
          tag="${release_slug}-v${version}"
          ! gh release view "$tag" >/dev/null 2>&1
          echo "PACKAGE_ID=$package_id" >> "$GITHUB_ENV"
          echo "PACKAGE_VERSION=$version" >> "$GITHUB_ENV"
          echo "RELEASE_SLUG=$release_slug" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"
          echo "RELEASE_ASSET=${release_slug}-${version}.clipsx" >> "$GITHUB_ENV"
      - name: Build reviewed release assets
        env:
          CLIPSX_REPO: ${{ github.workspace }}/clipsx-host
        run: |
          url="https://github.com/${{ github.repository }}/releases/download/${RELEASE_TAG}/${RELEASE_ASSET}"
          npm run package -- "${{ inputs.package }}" "dist/${RELEASE_ASSET}" "$url"
      - name: Publish immutable release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" \
            "dist/${RELEASE_ASSET}" \
            "dist/${RELEASE_SLUG}-${PACKAGE_VERSION}.registry.json" \
            --target "$GITHUB_SHA" \
            --title "${{ inputs.package }} ${PACKAGE_VERSION}" \
            --notes "Validated Infiniti ClipsX extension release."

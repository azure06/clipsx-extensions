name: Publish checked extension releases
on:
  pull_request:
    branches: [main]
    types: [closed]
permissions:
  contents: write
  actions: read
concurrency:
  group: extension-publication-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  publish:
    if: github.event.pull_request.merged == true && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment: extension-publication
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Publish existing checked bytes - no build
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/publish-release.mjs
      - name: Detect publication handoff
        id: published
        run: |
          if [[ -f published-releases.json ]]; then echo "present=true" >> "$GITHUB_OUTPUT"; fi
      - name: Get narrowly scoped registry PR token
        if: steps.published.outputs.present == 'true'
        id: app
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349
        with:
          app-id: ${{ vars.CLIPSX_RELEASE_APP_ID }}
          private-key: ${{ secrets.CLIPSX_RELEASE_APP_PRIVATE_KEY }}
          owner: azure06
          repositories: clipsx-registry
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        if: steps.published.outputs.present == 'true'
        with:
          repository: azure06/clipsx-registry
          ref: main
          path: registry
          token: ${{ steps.app.outputs.token }}
      - name: Open or update the metadata PR
        if: steps.published.outputs.present == 'true'
        working-directory: registry
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: node scripts/open-release-pr.mjs ../published-releases.json

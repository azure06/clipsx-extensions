name: Extension packages

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [ask-ai, base64, data-tools, jwt-inspector, mermaid-viewer, rewrite]
    steps:
      - uses: actions/checkout@v4
      - name: Check out the pinned ClipsX package tool
        uses: actions/checkout@v4
        with:
          repository: azure06/clipsx
          path: clipsx-host
          ref: 65bc19e38427561a4a3e85129c9314de57e02e1a
      - name: Install host validator dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libxdo-dev
      - run: rustup target add wasm32-unknown-unknown
      - run: npm ci
      - name: Build, test, and prove deterministic packaging
        env:
          CLIPSX_REPO: ${{ github.workspace }}/clipsx-host
        run: npm run package -- ${{ matrix.package }} dist/${{ matrix.package }}.clipsx
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.package }}
          path: dist/${{ matrix.package }}.clipsx
          if-no-files-found: error

  repository-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enforce published identity policy
        shell: bash
        run: |
          set -euo pipefail
          ! grep -R -E 'firstparty\.|example\.ask-ai|communication-actions|Communication Actions' \
            --exclude-dir=.git --exclude-dir=node_modules --exclude-dir=target .
          test "$(find extensions -mindepth 1 -maxdepth 1 -type d | wc -l)" -eq 6

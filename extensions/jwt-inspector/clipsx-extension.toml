schemaVersion = 3
contractRevision = 3
packageId = "infiniti.jwt-inspector"
version = "2.0.0"
apiVersion = "^3.2"
displayName = "JWT Inspector"
description = "Inspect JWT headers, claims, and timestamps locally without implying signature verification."
license = "MIT"

iconAssets = { light = "icons/jwt-mark-light.svg", dark = "icons/jwt-mark-dark.svg" }

[permissions]
selectedInput = true

[[settings]]
id = "show-raw"
label = "Show raw JSON by default"
kind = "boolean"
default = false
portable = true

[[contributions]]
id = "detect-jwt"
kind = "detector"
displayName = "JWT detector"
emitsFacetIds = ["jwt"]
[[contributions.matchers]]
mimeTypes = ["text/plain"]

[[contributions]]
id = "jwt-detail"
kind = "renderer"
displayName = "JWT"
purpose = "structured"
surfaces = ["detail"]
iconAssets = { light = "icons/jwt-mark-light.svg", dark = "icons/jwt-mark-dark.svg" }
uiEntry = "ui/index.html"
uiSurfaces = ["detail"]
effects = ["copy"]
[[contributions.matchers]]
facetIds = ["infiniti.jwt-inspector.jwt"]

[[contributions]]
id = "extract-jwt"
kind = "transformer"
displayName = "Extract JWT JSON"
parameterSchema = { type = "object", properties = { part = { type = "string", enum = ["header", "payload"] } }, required = ["part"] }
setupSelectorParameter = "part"
defaultView = "result_only"
resultControls = ["copy", "paste", "save_as_clip", "regenerate"]
[[contributions.setups]]
id = "copy-payload"
displayName = "JWT payload"
parameters = { part = "payload" }

[[contributions.setups]]
id = "extract-header"
displayName = "JWT header"
parameters = { part = "header" }

[[contributions.matchers]]
facetIds = ["infiniti.jwt-inspector.jwt"]

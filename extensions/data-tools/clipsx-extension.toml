# Strict GFM Markdown table actions.
[[contributions]]
id = "markdown-table-to-json"
kind = "action"
displayName = "Markdown table to JSON"
icon = "braces"
placements = ["action_menu"]
effects = ["preview", "copy", "save_as_clip"]
handler = { kind = "transformer_preset", transformerId = "data-transform", parameters = { operation = "markdown-to-json" }, disposition = "preview" }
[[contributions.matchers]]

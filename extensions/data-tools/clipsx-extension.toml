schemaVersion = 2
contractRevision = 2
packageId = "firstparty.data-tools"
version = "1.0.1"
apiVersion = "^2.0"
displayName = "Data Tools"
description = "Convert structured data between JSON, CSV, and Markdown tables locally."
license = "MIT"
iconAssets = { light = "icons/package-light.svg", dark = "icons/package-dark.svg" }

[[contributions]]
id = "data-transform"
kind = "transformer"
displayName = "Convert structured data"
parameterSchema = { type = "object", properties = { operation = { type = "string", enum = ["json-to-csv", "json-to-markdown", "csv-to-json", "csv-to-markdown"] } }, required = ["operation"] }
[[contributions.matchers]]
mimeTypes = ["text/plain", "application/json", "text/csv"]

[[contributions]]
id = "json-to-csv"
kind = "action"
displayName = "Convert JSON to CSV"
placements = ["action_menu"]
effects = ["preview", "copy", "save_as_clip"]
handler = { kind = "transformer_preset", transformerId = "data-transform", parameters = { operation = "json-to-csv" }, disposition = "preview" }
[[contributions.matchers]]
facetIds = ["core.data.json"]

[[contributions]]
id = "json-to-markdown"
kind = "action"
displayName = "Convert JSON to Markdown table"
placements = ["action_menu"]
effects = ["preview", "copy", "save_as_clip"]
handler = { kind = "transformer_preset", transformerId = "data-transform", parameters = { operation = "json-to-markdown" }, disposition = "preview" }
[[contributions.matchers]]
facetIds = ["core.data.json"]

[[contributions]]
id = "table-to-json"
kind = "action"
displayName = "Convert table to JSON"
placements = ["action_menu"]
effects = ["preview", "copy", "save_as_clip"]
handler = { kind = "transformer_preset", transformerId = "data-transform", parameters = { operation = "csv-to-json" }, disposition = "preview" }
[[contributions.matchers]]
facetIds = ["core.data.table"]

[[contributions]]
id = "table-to-markdown"
kind = "action"
displayName = "Convert table to Markdown"
placements = ["action_menu"]
effects = ["preview", "copy", "save_as_clip"]
handler = { kind = "transformer_preset", transformerId = "data-transform", parameters = { operation = "csv-to-markdown" }, disposition = "preview" }
[[contributions.matchers]]
facetIds = ["core.data.table"]

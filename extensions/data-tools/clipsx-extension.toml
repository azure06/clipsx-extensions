displayName = "Table to TSV"
icon = "table"
placements = ["action_menu"]
effects = ["preview", "copy", "save_as_clip"]
handler = { kind = "transformer_preset", transformerId = "data-transform", parameters = { operation = "table-to-tsv" }, disposition = "preview" }

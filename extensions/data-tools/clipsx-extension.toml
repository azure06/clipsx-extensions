schemaVersion = 2
contractRevision = 2
packageId = "infiniti.data-tools"
version = "1.1.0"
apiVersion = "^2.0"
displayName = "Data Tools"
description = "Convert tables, structured data, TypeScript shapes, and URLs locally."
license = "MIT"
iconAssets = { light = "icons/package-light.svg", dark = "icons/package-dark.svg" }

[[contributions]]
id = "markdown-table-detector"
kind = "detector"
displayName = "Markdown table detector"
emitsFacetIds = ["markdown-table"]
[[contributions.matchers]]
mimeTypes = ["text/plain", "text/markdown"]

[[contributions]]
id = "data-transform"
kind = "transformer"
displayName = "Convert data"
exposeInMenu = false
parameterSchema = { type = "object", properties = { operation = { type = "string", enum = ["json-to-csv", "json-to-tsv", "json-to-markdown", "json-to-yaml", "json-to-toml", "json-to-typescript", "table-to-json", "table-to-csv", "table-to-tsv", "table-to-markdown", "markdown-to-json", "markdown-to-csv", "markdown-to-tsv", "yaml-to-json", "toml-to-json", "url-encode", "url-decode", "url-normalize", "url-query-to-json"] }, root_name = { type = "string", default = "Root", minLength = 1, maxLength = 80 } }, required = ["operation"], additionalProperties = false }
[[contributions.matchers]]
mimeTypes = ["text/plain", "text/markdown", "text/csv", "text/tab-separated-values", "application/json", "application/yaml", "application/x-yaml", "application/toml"]

# JSON actions
[[contributions]]
id = "json-to-csv"
kind = "action"
displayName = "JSON to CSV"
icon = "table"
placements = ["action_menu"]
effects = ["preview", "copy", "save_as_clip"]
handler = { kind = "transformer_preset", transformerId = "data-transform", parameters = { operation = "json-to-csv" }, disposition = "preview" }
[[contributions.matchers]]
facetIds = ["core.data.json"]

[[contributions]]
id = "json-to-tsv"
kind = "action"
displayName = "JSON to TSV"
icon = "table"
placements = ["action_menu"]
effects = ["preview", "copy", "save_as_clip"]
handler = { kind = "transformer_preset", transformerId = "data-transform", parameters = { operation = "json-to-tsv" }, disposition = "preview" }
[[contributions.matchers]]
facetIds = ["core.data.json"]

[[contributions]]
id = "json-to-markdown"
kind = "action"
displayName = "JSON to Markdown table"
icon = "text"
placements = ["action_menu"]
effects = ["preview", "copy", "save_as_clip"]
handler = { kind = "transformer_preset", transformerId = "data-transform", parameters = { operation = "json-to-markdown" }, disposition = "preview" }
[[contributions.matchers]]
facetIds = ["core.data.json"]

[[contributions]]
id = "json-to-yaml"
kind = "action"
displayName = "JSON to YAML"
icon = "database"
placements = ["action_menu"]
effects = ["preview", "copy", "save_as_clip"]
handler = { kind = "transformer_preset", transformerId = "data-transform", parameters = { operation = "json-to-yaml" }, disposition = "preview" }
[[contributions.matchers]]
facetIds = ["core.data.json"]

[[contributions]]
id = "json-to-toml"
kind = "action"
displayName = "JSON to TOML"
icon = "database"
placements = ["action_menu"]
effects = ["preview", "copy", "save_as_clip"]
handler = { kind = "transformer_preset", transformerId = "data-transform", parameters = { operation = "json-to-toml" }, disposition = "preview" }
[[contributions.matchers]]
facetIds = ["core.data.json"]

[[contributions]]
id = "json-to-typescript"
kind = "action"
displayName = "JSON to TypeScript"
icon = "code"
placements = ["action_menu"]
effects = ["preview", "copy", "save_as_clip"]
parameterSchema = { type = "object", properties = { root_name = { type = "string", title = "Root type name", default = "Root", minLength = 1, maxLength = 80 } }, additionalProperties = false }
handler = { kind = "transformer_preset", transformerId = "data-transform", parameters = { operation = "json-to-typescript" }, disposition = "preview" }
[[contributions.matchers]]
facetIds = ["core.data.json"]

# CSV/TSV actions; the transformer detects the delimiter safely.
[[contributions]]
id = "table-to-json"
kind = "action"
displayName = "Table to JSON"
icon = "braces"
placements = ["action_menu"]
effects = ["preview", "copy", "save_as_clip"]
handler = { kind = "transformer_preset", transformerId = "data-transform", parameters = { operation = "table-to-json" }, disposition = "preview" }
[[contributions.matchers]]
facetIds = ["core.data.table"]


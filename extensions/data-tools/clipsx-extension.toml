schemaVersion = 3
contractRevision = 3
packageId = "infiniti.data-tools"
version = "2.0.0"
apiVersion = "^3.2"
displayName = "Data Tools"
description = "Convert tables, structured data, TypeScript shapes, and URLs locally."
license = "MIT"

iconAssets = { light = "icons/package-light.svg", dark = "icons/package-dark.svg" }

[permissions]
selectedInput = true

[[contributions]]
id = "markdown-table-detector"
kind = "detector"
displayName = "Markdown table detector"
emitsFacetIds = ["markdown-table"]
[[contributions.matchers]]
mimeTypes = ["text/plain", "text/markdown"]

[[contributions]]
id = "data-transform"
kind = "transformer"
displayName = "Convert data"
parameterSchema = { type = "object", properties = { operation = { type = "string", enum = ["json-to-csv", "json-to-tsv", "json-to-markdown", "json-to-yaml", "json-to-toml", "json-to-typescript", "table-to-json", "table-to-csv", "table-to-tsv", "table-to-markdown", "markdown-to-json", "markdown-to-csv", "markdown-to-tsv", "yaml-to-json", "toml-to-json", "url-encode", "url-decode", "url-normalize", "url-query-to-json"] }, root_name = { type = "string", default = "Root", minLength = 1, maxLength = 80 } }, required = ["operation"], additionalProperties = false }
setupSelectorParameter = "operation"
parameterUi = [{ field = "root_name", label = "Root type name", control = "text", when = { field = "operation", equals = "json-to-typescript" }, required = true }]
defaultView = "result_only"
resultControls = ["copy", "paste", "save_as_clip", "regenerate"]
[[contributions.setups]]
id = "json-to-csv"
displayName = "JSON to CSV"
parameters = { operation = "json-to-csv" }

[[contributions.setups]]
id = "json-to-tsv"
displayName = "JSON to TSV"
parameters = { operation = "json-to-tsv" }

[[contributions.setups]]
id = "json-to-markdown"
displayName = "JSON to Markdown table"
parameters = { operation = "json-to-markdown" }

[[contributions.setups]]
id = "json-to-yaml"
displayName = "JSON to YAML"
parameters = { operation = "json-to-yaml" }

[[contributions.setups]]
id = "json-to-toml"
displayName = "JSON to TOML"
parameters = { operation = "json-to-toml" }

[[contributions.setups]]
id = "json-to-typescript"
displayName = "JSON to TypeScript"
parameters = { operation = "json-to-typescript" }

[[contributions.setups]]
id = "table-to-json"
displayName = "Table to JSON"
parameters = { operation = "table-to-json" }

[[contributions.setups]]
id = "table-to-csv"
displayName = "Table to CSV"
parameters = { operation = "table-to-csv" }

[[contributions.setups]]
id = "table-to-tsv"
displayName = "Table to TSV"
parameters = { operation = "table-to-tsv" }

[[contributions.setups]]
id = "table-to-markdown"
displayName = "Table to Markdown"
parameters = { operation = "table-to-markdown" }

[[contributions.setups]]
id = "markdown-table-to-json"
displayName = "Markdown table to JSON"
parameters = { operation = "markdown-to-json" }

[[contributions.setups]]
id = "markdown-table-to-csv"
displayName = "Markdown table to CSV"
parameters = { operation = "markdown-to-csv" }

[[contributions.setups]]
id = "markdown-table-to-tsv"
displayName = "Markdown table to TSV"
parameters = { operation = "markdown-to-tsv" }

[[contributions.setups]]
id = "yaml-to-json"
displayName = "YAML to JSON"
parameters = { operation = "yaml-to-json" }

[[contributions.setups]]
id = "toml-to-json"
displayName = "TOML to JSON"
parameters = { operation = "toml-to-json" }

[[contributions.setups]]
id = "url-encode"
displayName = "URL encode"
parameters = { operation = "url-encode" }

[[contributions.setups]]
id = "url-decode"
displayName = "URL decode"
parameters = { operation = "url-decode" }

[[contributions.setups]]
id = "url-normalize"
displayName = "Normalize URL"
parameters = { operation = "url-normalize" }

[[contributions.setups]]
id = "url-query-to-json"
displayName = "URL query to JSON"
parameters = { operation = "url-query-to-json" }

[[contributions.matchers]]
mimeTypes = ["text/plain", "text/markdown", "text/csv", "text/tab-separated-values", "application/json", "application/yaml", "application/x-yaml", "application/toml"]

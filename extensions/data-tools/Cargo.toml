[package]
name = "clipsx-data-tools"
version = "1.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
csv = "1.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml = "0.8"
url = "2.5"
urlencoding = "2.1"
wit-bindgen = "0.57.1"

[profile.release]
opt-level = "s"
lto = true
strip = true

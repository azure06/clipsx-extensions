schemaVersion = 2
contractRevision = 2
packageId = "firstparty.curl-to-fetch"
version = "1.0.0"
apiVersion = "^2.0"
displayName = "curl to fetch"
description = "Convert common curl commands to readable browser fetch code entirely offline."
license = "MIT"
iconAssets = { light = "icons/package-light.svg", dark = "icons/package-dark.svg" }

[[contributions]]
id = "detect-curl"
kind = "detector"
displayName = "curl detector"
emitsFacetIds = ["curl"]
[[contributions.matchers]]
mimeTypes = ["text/plain"]

[[contributions]]
id = "fetch-detail"
kind = "renderer"
displayName = "fetch"
purpose = "structured"
surfaces = ["detail"]
uiEntry = "ui/index.html"
uiSurfaces = ["detail"]
effects = ["copy"]
[[contributions.matchers]]
facetIds = ["firstparty.curl-to-fetch.curl"]

[[contributions]]
id = "convert-curl"
kind = "transformer"
displayName = "Convert curl to fetch"
parameterSchema = { type = "object", properties = {} }
[[contributions.matchers]]
facetIds = ["firstparty.curl-to-fetch.curl"]

[[contributions]]
id = "copy-fetch"
kind = "action"
displayName = "Copy as fetch"
placements = ["preview_toolbar", "action_menu"]
effects = ["copy"]
handler = { kind = "transformer_preset", transformerId = "convert-curl", parameters = {}, disposition = "copy" }
[[contributions.matchers]]
facetIds = ["firstparty.curl-to-fetch.curl"]

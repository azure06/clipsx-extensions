schemaVersion = 2
contractRevision = 2
packageId = "firstparty.communication-actions"
version = "1.0.0"
apiVersion = "^2.0"
displayName = "Communication Actions"
description = "Offline email and phone detection with narrowly scoped native Compose and Dial actions."
license = "MIT"
iconAssets = { light = "icons/communication-light.svg", dark = "icons/communication-dark.svg" }

[[contributions]]
id = "detect-contact"
kind = "detector"
displayName = "Email and phone detector"
emitsFacetIds = ["email", "phone"]

[[contributions.matchers]]
mimeTypes = ["text/plain"]

[[contributions]]
id = "compose-email"
kind = "action"
displayName = "Compose Email"
placements = ["preview_toolbar", "action_menu"]
effects = ["compose_email"]
handler = { kind = "compose_email", facetValuePointer = "/address" }

[[contributions.matchers]]
facetIds = ["firstparty.communication-actions.email"]

[[contributions]]
id = "dial-phone"
kind = "action"
displayName = "Dial Phone"
placements = ["preview_toolbar", "action_menu"]
effects = ["dial_phone"]
handler = { kind = "dial_phone", facetValuePointer = "/number" }

[[contributions.matchers]]
facetIds = ["firstparty.communication-actions.phone"]


schemaVersion = 3
contractRevision = 3
packageId = "infiniti.rewrite"
version = "2.0.0"
apiVersion = "^3.2"
displayName = "Rewrite"
description = "Rewrite copied text with the configured local generation model."
license = "Apache-2.0"
iconAssets = { light = "icons/rewrite-light.svg", dark = "icons/rewrite-dark.svg" }

[permissions]
providers = ["generation.text"]
selectedInput = true
backgroundClipCreated = true
sourceApplication = true
packageState = false

[[contributions]]
id = "rewrite"
kind = "transformer"
displayName = "Rewrite"
execution = "capability_backed"
parameterSchema = { type = "object", properties = { preset = { type = "string", enum = ["business", "casual", "concise", "improve_writing", "translate", "custom"] }, target_language = { type = "string", maxLength = 64 }, custom_instruction = { type = "string", maxLength = 4096 } }, required = ["preset"] }
setupSelectorParameter = "preset"
defaultView = "result_only"
resultControls = ["copy", "paste", "save_as_clip", "regenerate"]
[[contributions.parameterUi]]
field = "preset"
label = "Preset"
control = "select"

[[contributions.parameterUi]]
field = "target_language"
label = "Target language"
control = "text"
when = { field = "preset", equals = "translate" }
required = true

[[contributions.parameterUi]]
field = "custom_instruction"
label = "Custom instruction"
control = "textarea"
when = { field = "preset", equals = "custom" }
required = true

[[contributions.setups]]
id = "business"
displayName = "Business"
parameters = { preset = "business" }

[[contributions.setups]]
id = "casual"
displayName = "Casual"
parameters = { preset = "casual" }

[[contributions.setups]]
id = "concise"
displayName = "Concise"
parameters = { preset = "concise" }

[[contributions.setups]]
id = "improve-writing"
displayName = "Improve writing"
parameters = { preset = "improve_writing" }

[[contributions.setups]]
id = "translate"
displayName = "Translate"
parameters = { preset = "translate" }

[[contributions.setups]]
id = "custom"
displayName = "Custom"
parameters = { preset = "custom" }

[[contributions.matchers]]
mimeTypes = ["text/plain"]

[[activations]]
id = "on-copy"
event = "clip_created"
transformerId = "rewrite"

[[activations.matchers]]
mimeTypes = ["text/plain"]
